{% extends "base.html" %}

{% block content %}
<div style="display: flex; height: calc(100vh - 100px); gap: 20px; padding: 20px;">
    <!-- Левая колонка - Курс -->
    <div style="flex: 1; background: #f5f5f5; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h2 style="color: #2c3e50; text-align: center;">🗺️ Курс</h2>
        <div style="display: flex; justify-content: center; align-items: center; height: 80%;">
            <p style="color: #7f8c8d; font-size: 20px;">Карта в разработке</p>
        </div>
    </div>
    
    <!-- Правая колонка - Приложение -->
    <div style="flex: 1; background: #f5f5f5; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
        <h2 style="color: #2c3e50; text-align: center;">📱 Приложение наблюдателя</h2>
        <div style="display: flex; justify-content: center; align-items: center; height: 80%;">
            <p style="color: #7f8c8d; font-size: 20px;">В разработке</p>
        </div>
    </div>
</div>
{% endblock %}
