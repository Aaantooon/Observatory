<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Путь наблюдателя</title>
    <style>
        *{margin:0;padding:0;overflow:hidden}
        body{background:#05070a;font-family:'Segoe UI',sans-serif;cursor:crosshair}
        #canvas{width:100vw;height:100vh;display:block}
        
        #ui{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
            background:rgba(5,7,10,0.92);border:1px solid rgba(226,192,68,0.08);
            border-radius:16px;padding:14px 28px;text-align:center;z-index:100;
            backdrop-filter:blur(12px);pointer-events:none;min-width:280px;
            box-shadow:0 0 60px rgba(0,0,0,0.9)}
        #ui .title{color:#8899aa;font-size:0.9rem;font-weight:300;letter-spacing:3px}
        #ui .desc{color:#5a6a7a;font-size:0.75rem;margin-top:4px;letter-spacing:1px}
        #ui .hint{color:#3a4a5a;font-size:0.6rem;margin-top:6px;letter-spacing:2px}
        #ui .progress{color:#e2c044;font-size:0.7rem;margin-top:8px;opacity:0.3}
        #ui .progress span{color:#e2c044;font-size:0.8rem;opacity:0.6}
        
        #vignette{position:fixed;top:0;left:0;width:100vw;height:100vh;
            background:radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
            pointer-events:none;z-index:10}
        
        #label3d{position:fixed;top:50%;left:50%;transform:translate(-50%, -100%);
            color:#e2c044;font-size:1.4rem;letter-spacing:3px;z-index:20;
            pointer-events:none;opacity:0;transition:opacity 0.4s ease;
            text-shadow:0 0 40px rgba(226,192,68,0.15), 0 0 80px rgba(226,192,68,0.05)}
        #label3d .sub{font-size:0.7rem;color:#5a6a7a;letter-spacing:1px;display:block;margin-top:4px}
        
        #modal{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;
            background:rgba(0,0,0,0.85);z-index:200;justify-content:center;align-items:center}
        #modal .box{background:rgba(5,7,10,0.96);border:1px solid rgba(226,192,68,0.1);
            border-radius:16px;padding:40px;max-width:440px;text-align:center;
            animation:fadeIn 0.5s ease}
        @keyframes fadeIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
        #modal .box h2{color:#e2c044;font-weight:300;margin-bottom:16px;font-size:1.4rem;letter-spacing:3px}
        #modal .box p{color:#8899aa;font-size:0.95rem;line-height:1.9;letter-spacing:0.5px}
        #modal .box .icon{font-size:2rem;display:block;margin-bottom:12px}
        #modal .box button{margin-top:24px;padding:10px 36px;background:transparent;
            border:1px solid rgba(226,192,68,0.15);color:#8899aa;border-radius:50px;
            cursor:pointer;font-size:0.8rem;letter-spacing:2px;transition:0.3s}
        #modal .box button:hover{background:rgba(226,192,68,0.05);border-color:rgba(226,192,68,0.25)}
        
        #flashlight-icon{position:fixed;bottom:100px;right:30px;font-size:2rem;z-index:15;
            opacity:0.2;pointer-events:none;transition:opacity 0.5s}
        
        #breath-indicator{position:fixed;bottom:100px;left:30px;color:#2a3a4a;font-size:0.6rem;
            z-index:15;letter-spacing:2px;opacity:0.3;pointer-events:none}
        
        @media(max-width:768px){#ui{min-width:200px;padding:10px 16px;bottom:15px}
        #label3d{font-size:1rem}#modal .box{padding:24px}}
    </style>
</head>
<body>

<div id="vignette"></div>
<div id="flashlight-icon">🔦</div>
<div id="breath-indicator">◈ дыхание</div>
<div id="label3d"></div>
<canvas id="canvas"></canvas>

<div id="ui">
    <div class="title" id="title">🌫️ Туман зовёт</div>
    <div class="desc" id="desc">Иди вперёд. Наводи фонарик на образы.</div>
    <div class="hint" id="hint">WASD — ходьба · Мышь — осмотр · Клик — взаимодействие</div>
    <div class="progress" id="progress">0 <span>/ 5</span></div>
</div>

<div id="modal">
    <div class="box">
        <span class="icon" id="modalIcon">✦</span>
        <h2 id="modalTitle">Тема</h2>
        <p id="modalText">Текст урока</p>
        <button onclick="document.getElementById('modal').style.display='none'">✕ Продолжить путь</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/6.37.0/babylon.js"></script>
<script>
// ============================================================
// ДАННЫЕ КУРСА С ИКОНАМИ
// ============================================================
const SLIDES = [
    { title:'Введение в наблюдение', color:'#4a7a9a', icon:'👁️', lesson:'Просто наблюдай. Не оценивай. Будь свидетелем.' },
    { title:'Стресс и его проявления', color:'#c04a4a', icon:'⚡', lesson:'Стресс — реакция. Научись видеть его до того, как он захватит тебя.' },
    { title:'Практика внимательности', color:'#4ac06a', icon:'🌿', lesson:'Дыхание — мост между телом и умом. Просто дыши.' },
    { title:'Эмоциональный интеллект', color:'#c08a4a', icon:'🌀', lesson:'Эмоции — энергия. Направь её в созидание.' },
    { title:'Путь к себе', color:'#8a4ac0', icon:'🌟', lesson:'Ты — целое. Все части уже внутри тебя.' }
];

let completed = 0;
let currentTarget = null;
let breathTime = 0;
let fogTarget = 0.025;
let isMoving = false;
let stepTimer = 0;

// ============================================================
// ЗВУК (Web Audio)
// ============================================================
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

function playStep() {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 80 + Math.random() * 40;
        osc.type = 'sine';
        gain.gain.value = 0.02;
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    } catch(e) {}
}

// ============================================================
// BABYLON
// ============================================================
const canvas = document.getElementById('canvas');
const engine = new BABYLON.Engine(canvas, true);
const scene = new BABYLON.Scene(engine);
scene.clearColor = new BABYLON.Color4(0.02, 0.025, 0.04, 1);

// --- ТУМАН ---
scene.fogMode = BABYLON.Scene.FOGMODE_EXP;
scene.fogDensity = 0.025;
scene.fogColor = new BABYLON.Color3(0.02, 0.025, 0.04);

// === КАМЕРА С WASD ===
const camera = new BABYLON.FreeCamera('cam', new BABYLON.Vector3(0, 1.6, 0), scene);
camera.attachControl(canvas, true);
camera.speed = 0.3;
camera.minZ = 0.1;
camera.maxZ = 30;
camera.rotation.y = Math.PI;

// ===== ВАЖНО: добавляем WASD для ходьбы =====
camera.keysUp.push(87);    // W
camera.keysDown.push(83);  // S
camera.keysLeft.push(65);  // A
camera.keysRight.push(68); // D

// --- СВЕТ ---
const ambient = new BABYLON.HemisphericLight('ambient', new BABYLON.Vector3(0, 1, 0), scene);
ambient.intensity = 0.06;

// Фонарик
const flashlight = new BABYLON.SpotLight('flash',
    new BABYLON.Vector3(0, 1.4, 0.5),
    new BABYLON.Vector3(0, 0, 1),
    Math.PI / 4, 1.5, scene
);
flashlight.parent = camera;
flashlight.intensity = 0.5;
flashlight.distance = 14;
flashlight.diffuse = new BABYLON.Color3(0.25, 0.35, 0.55);

const warmLight = new BABYLON.SpotLight('warm',
    new BABYLON.Vector3(0, 1.4, 0.5),
    new BABYLON.Vector3(0, 0, 1),
    Math.PI / 5, 1.2, scene
);
warmLight.parent = camera;
warmLight.intensity = 0.15;
warmLight.distance = 8;
warmLight.diffuse = new BABYLON.Color3(0.7, 0.6, 0.4);

// --- ЗЕМЛЯ ---
const ground = BABYLON.MeshBuilder.CreateGround('ground', {width:80, height:80}, scene);
const groundMat = new BABYLON.StandardMaterial('groundMat', scene);
groundMat.diffuseColor = new BABYLON.Color3(0.02, 0.025, 0.03);
ground.material = groundMat;
ground.position.y = -0.5;

// --- ДОРОГА ---
const pathPoints = [];
for (let i = 0; i <= 80; i++) {
    const z = -i * 0.7;
    const x = Math.sin(i * 0.12) * 2.0 + Math.sin(i * 0.35 + 0.5) * 0.5;
    pathPoints.push(new BABYLON.Vector3(x, -0.48, z));
}
const path = BABYLON.MeshBuilder.CreateLines('path', { points: pathPoints }, scene);
path.color = new BABYLON.Color3(0.08, 0.07, 0.05);

// Камни
for (let i = 0; i < 80; i+=1.5) {
    const idx = Math.floor(i);
    if (idx >= pathPoints.length) break;
    const p = pathPoints[idx];
    const stone = BABYLON.MeshBuilder.CreateSphere('stone', {diameter: 0.03 + Math.random()*0.06}, scene);
    const sMat = new BABYLON.StandardMaterial('sMat', scene);
    const g = 0.03 + Math.random() * 0.05;
    sMat.diffuseColor = new BABYLON.Color3(g, g, g+0.01);
    stone.material = sMat;
    stone.position = new BABYLON.Vector3(p.x + (Math.random()-0.5)*0.4, -0.48, p.z + (Math.random()-0.5)*0.25);
}

// --- ДЕРЕВЬЯ ---
function createTree(x, z, scale) {
    const group = new BABYLON.TransformNode('tree');
    group.position = new BABYLON.Vector3(x, 0, z);
    group.scaling = new BABYLON.Vector3(scale, scale, scale);

    const trunk = BABYLON.MeshBuilder.CreateCylinder('trunk', {height: 2 + Math.random()*1.5, diameter: 0.08 + Math.random()*0.06}, scene);
    const tMat = new BABYLON.StandardMaterial('tMat', scene);
    const dark = 0.02 + Math.random() * 0.03;
    tMat.diffuseColor = new BABYLON.Color3(dark, dark+0.01, dark+0.005);
    trunk.material = tMat;
    trunk.position.y = 1 + Math.random()*0.5;
    trunk.parent = group;
    trunk.rotation.z = (Math.random()-0.5)*0.15;

    for (let j = 0; j < 3 + Math.floor(Math.random()*3); j++) {
        const branch = BABYLON.MeshBuilder.CreateCylinder('branch', 
            {height: 0.6 + Math.random()*0.8, diameter: 0.02 + Math.random()*0.03}, scene);
        const bMat = new BABYLON.StandardMaterial('bMat', scene);
        bMat.diffuseColor = new BABYLON.Color3(dark+0.01, dark+0.02, dark+0.01);
        branch.material = bMat;
        branch.parent = group;
        const angle = Math.random() * Math.PI * 2;
        branch.position = new BABYLON.Vector3(
            Math.cos(angle) * 0.08,
            1.2 + Math.random() * 0.5,
            Math.sin(angle) * 0.08
        );
        branch.rotation.x = (Math.random()-0.5) * 0.6;
        branch.rotation.z = (Math.random()-0.5) * 0.6;
        branch.rotation.y = Math.random() * Math.PI * 2;
    }
    return group;
}

for (let i = 0; i < 100; i++) {
    let x = (Math.random() - 0.5) * 40;
    let z = -Math.random() * 50;
    let onRoad = false;
    for (let j = 0; j < pathPoints.length; j+=5) {
        const p = pathPoints[j];
        if (Math.abs(x - p.x) < 1.2 && Math.abs(z - p.z) < 0.8) { onRoad = true; break; }
    }
    if (!onRoad && Math.abs(x) < 8 && z > -5) onRoad = true;
    if (!onRoad) createTree(x, z, 0.6 + Math.random() * 0.8);
}

// ============================================================
// ОБЪЕКТЫ КУРСА
// ============================================================
const objects = [];
const objPositions = [
    { z: -5, x: -1.2 },
    { z: -11, x: 1.8 },
    { z: -17, x: -1.5 },
    { z: -23, x: 1.2 },
    { z: -29, x: 0.0 }
];

const label = document.getElementById('label3d');

SLIDES.forEach((data, i) => {
    const pos = objPositions[i];
    const color = new BABYLON.Color3(
        parseInt(data.color.slice(1,3),16)/255,
        parseInt(data.color.slice(3,5),16)/255,
        parseInt(data.color.slice(5,7),16)/255
    );

    const group = new BABYLON.TransformNode('group');
    group.position = new BABYLON.Vector3(pos.x, 0, pos.z);
    group.userData = { 
        slide: i, 
        completed: false, 
        title: data.title, 
        lesson: data.lesson,
        icon: data.icon,
        appearProgress: 0
    };

    // Сфера
    const sphere = BABYLON.MeshBuilder.CreateSphere('sphere', {diameter: 0.6}, scene);
    const mat = new BABYLON.StandardMaterial('mat', scene);
    mat.diffuseColor = color;
    mat.emissiveColor = color.scale(0.3);
    mat.roughness = 0.2;
    mat.metallic = 0.1;
    mat.alpha = 0.1;
    sphere.material = mat;
    sphere.position.y = 0.2;
    sphere.parent = group;

    // Свечение
    const glow = BABYLON.MeshBuilder.CreateSphere('glow', {diameter: 1.4}, scene);
    const gMat = new BABYLON.StandardMaterial('gMat', scene);
    gMat.diffuseColor = color;
    gMat.alpha = 0.01;
    gMat.emissiveColor = color.scale(0.03);
    glow.material = gMat;
    glow.position.y = 0.2;
    glow.parent = group;

    // Кольцо
    const ring = BABYLON.MeshBuilder.CreateTorus('ring', {diameter: 1.0, thickness: 0.015}, scene);
    const rMat = new BABYLON.StandardMaterial('rMat', scene);
    rMat.diffuseColor = color;
    rMat.emissiveColor = color.scale(0.08);
    rMat.alpha = 0.05;
    ring.material = rMat;
    ring.position.y = 0.2;
    ring.rotation.x = Math.PI/2 + 0.2;
    ring.parent = group;

    // Частицы
    for (let j = 0; j < 8; j++) {
        const p = BABYLON.MeshBuilder.CreateSphere('p', {diameter: 0.01 + Math.random()*0.015}, scene);
        const pMat = new BABYLON.StandardMaterial('pMat', scene);
        const c = color.clone();
        c.r += (Math.random()-0.5)*0.1;
        c.g += (Math.random()-0.5)*0.1;
        c.b += (Math.random()-0.5)*0.1;
        pMat.diffuseColor = c;
        pMat.emissiveColor = c.scale(0.5);
        pMat.alpha = 0.1 + Math.random()*0.2;
        p.material = pMat;
        const angle = Math.random() * Math.PI * 2;
        const radius = 0.4 + Math.random() * 0.4;
        p.position = new BABYLON.Vector3(
            Math.cos(angle) * radius,
            0.2 + Math.sin(angle * 2 + j) * 0.1,
            Math.sin(angle) * radius
        );
        p.parent = group;
        p.userData = { angle, radius, speed: 0.003 + Math.random()*0.005, yOff: Math.random()*Math.PI*2 };
    }

    // Клик
    sphere.actionManager = new BABYLON.ActionManager(scene);
    sphere.actionManager.registerAction(
        new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, () => {
            if (!group.userData.completed) {
                initAudio();
                group.userData.completed = true;
                completed++;
                mat.emissiveIntensity = 1.5;
                mat.alpha = 0.6;
                document.getElementById('modalIcon').textContent = data.icon;
                document.getElementById('modalTitle').textContent = data.title;
                document.getElementById('modalText').textContent = data.lesson;
                document.getElementById('modal').style.display = 'flex';
                document.getElementById('progress').innerHTML = `${completed} <span>/ ${SLIDES.length}</span>`;
                if (completed === SLIDES.length) {
                    document.getElementById('title').textContent = '🌟 Путь завершён!';
                    document.getElementById('desc').textContent = 'Ты стал наблюдателем. Свет внутри тебя.';
                }
            }
        })
    );

    objects.push(group);
});

// ============================================================
// ГЛАВНЫЙ ЦИКЛ
// ============================================================
scene.registerBeforeRender(() => {
    const time = Date.now() * 0.001;
    breathTime += 0.01;

    // Дыхание камеры
    const breath = Math.sin(breathTime * 1.2) * 0.003;
    camera.position.y = 1.6 + breath;
    document.getElementById('breath-indicator').style.opacity = 0.15 + Math.sin(breathTime * 1.2) * 0.1 + 0.15;

    // Шаги
    const wasMoving = isMoving;
    isMoving = Math.abs(camera.position.x) > 0.001 || Math.abs(camera.position.z) > 0.001;
    if (isMoving && !wasMoving) stepTimer = 0;
    if (isMoving) {
        stepTimer += 0.01;
        if (stepTimer > 0.3) {
            stepTimer = 0;
            playStep();
        }
    }

    // Анимация объектов (появление из тумана)
    objects.forEach((group, i) => {
        const dist = BABYLON.Vector3.Distance(camera.position, group.position);
        const appearSpeed = 0.005;
        if (dist < 12 && !group.userData.completed) {
            group.userData.appearProgress = Math.min(1, group.userData.appearProgress + appearSpeed);
        } else if (dist > 15) {
            group.userData.appearProgress = Math.max(0, group.userData.appearProgress - appearSpeed * 0.5);
        }
        
        const progress = group.userData.appearProgress;
        const sphere = group.getChildren().find(c => c.name === 'sphere');
        if (sphere && sphere.material) {
            sphere.material.alpha = 0.05 + progress * 0.85;
            sphere.material.emissiveIntensity = 0.1 + progress * 0.4;
        }
        const glow = group.getChildren().find(c => c.name === 'glow');
        if (glow && glow.material) {
            glow.material.alpha = progress * 0.04;
        }
        const ring = group.getChildren().find(c => c.name === 'ring');
        if (ring && ring.material) {
            ring.material.alpha = progress * 0.15;
        }
        group.getChildMeshes().forEach(m => {
            if (m.name === 'p' && m.material) {
                m.material.alpha = (0.05 + progress * 0.35) * (0.5 + Math.random()*0.5);
            }
        });
        
        if (!group.userData.completed && progress > 0.1) {
            group.rotation.y += 0.003;
            if (sphere) {
                const pulse = Math.sin(time * 0.8 + i * 1.2) * 0.5 + 0.5;
                const s = 1 + pulse * 0.04 * progress;
                sphere.scaling = new BABYLON.Vector3(s, s, s);
            }
        }
        group.getChildMeshes().forEach(m => {
            if (m.userData && m.userData.angle !== undefined && progress > 0.1) {
                m.userData.angle += m.userData.speed * progress;
                const a = m.userData.angle;
                const r = m.userData.radius;
                m.position.x = Math.cos(a) * r;
                m.position.z = Math.sin(a) * r;
                m.position.y = 0.2 + Math.sin(a * 1.5 + m.userData.yOff) * 0.1 * progress;
            }
        });
    });

    // Raycast: фонарик и надписи
    const ray = new BABYLON.Ray(camera.position, camera.getDirection(new BABYLON.Vector3(0, 0, 1)));
    ray.length = 12;
    const hit = scene.pickWithRay(ray, (m) => {
        return m.name === 'sphere' && m.parent && !m.parent.userData.completed && m.parent.userData.appearProgress > 0.5;
    });

    if (hit && hit.pickedMesh) {
        const group = hit.pickedMesh.parent;
        const idx = group.userData.slide;
        const data = SLIDES[idx];
        label.innerHTML = `${data.icon} ${data.title} <span class="sub">✦ наведи и кликни</span>`;
        label.style.opacity = '1';
        flashlight.intensity = 1.0 + Math.sin(time * 2) * 0.15;
        warmLight.intensity = 0.5 + Math.sin(time * 1.5) * 0.1;
        fogTarget = 0.008;
        const sphere = group.getChildren().find(c => c.name === 'sphere');
        if (sphere && sphere.material) {
            sphere.material.emissiveIntensity = 0.8 + Math.sin(time * 2) * 0.2;
        }
        currentTarget = group;
        document.getElementById('flashlight-icon').style.opacity = '0.8';
    } else {
        label.style.opacity = '0';
        flashlight.intensity = 0.5;
        warmLight.intensity = 0.15;
        fogTarget = 0.025;
        objects.forEach(g => {
            const sphere = g.getChildren().find(c => c.name === 'sphere');
            if (sphere && sphere.material && !g.userData.completed) {
                sphere.material.emissiveIntensity = 0.1 + g.userData.appearProgress * 0.3;
            }
        });
        currentTarget = null;
        document.getElementById('flashlight-icon').style.opacity = '0.2';
    }

    scene.fogDensity += (fogTarget - scene.fogDensity) * 0.015;

    if (!hit && completed < SLIDES.length) {
        document.getElementById('title').textContent = '🌫️ Туман зовёт';
        document.getElementById('desc').textContent = 'Иди вперёд. Образы появляются из тумана.';
    }
});

// ============================================================
// РЕСАЙЗ И ЗАПУСК
// ============================================================
window.addEventListener('resize', () => engine.resize());
engine.runRenderLoop(() => scene.render());

console.log('🔦 Путь наблюдателя: WASD — ходьба, мышь — осмотр, клик — взаимодействие.');
</script>
</body>
</html>
