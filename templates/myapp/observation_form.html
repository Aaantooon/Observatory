{% extends 'base.html' %}

{% block title %}Новая запись — Путь наблюдателя{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow bg-dark text-white border-secondary">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">🪐 Сделать запись в журнал</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label text-warning">{{ field.label }}</label>
                        <!-- Добавляем классы Bootstrap к полям формы -->
                        {{ field.as_widget }}
                        <!-- Если поле это Textarea или Input, оно не всегда получает классы автоматически. 
                             Лучше использовать crispy-forms, но для простоты мы добавим CSS стилизацию в base.html -->
                        {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    
                    <button type="submit" class="btn btn-warning w-100 text-dark fw-bold">Опубликовать наблюдение</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
