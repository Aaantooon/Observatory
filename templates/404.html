<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Путь наблюдателя</title>
<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0e14;
        color: #d4d9e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
    }
    .wrap { max-width: 420px; }
    .code { font-size: 4rem; font-weight: 300; letter-spacing: 4px; color: #e2c044; margin: 0 0 8px; }
    h1 { font-size: 1.2rem; font-weight: 400; margin: 0 0 12px; color: #d4d9e6; }
    p { color: #aab3c9; line-height: 1.5; margin: 0 0 24px; }
    a {
        display: inline-block;
        padding: 10px 24px;
        background: #e2c044;
        color: #16213e;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 500;
    }
    a:hover { background: #f0d65a; }
</style>
</head>
<body>
    <div class="wrap">
        <p class="code">404</p>
        <h1>🌫️ Здесь только туман</h1>
        <p>Такой страницы не существует — возможно, ссылка устарела или адрес введён неверно.</p>
        <a href="/">Вернуться на главную</a>
    </div>
</body>
</html>
