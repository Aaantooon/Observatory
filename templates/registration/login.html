{% extends 'base.html' %}

{% block title %}Вход — Путь наблюдателя{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 60px auto; padding: 0 20px;">
    <div style="text-align: center; padding: 40px 30px; border: 1px solid rgba(226,192,68,0.2); border-radius: 20px; background: rgba(22,33,62,0.5); backdrop-filter: blur(10px); box-shadow: 0 0 60px rgba(0,0,0,0.3);">
        <div style="font-size: 3rem; margin-bottom: 20px;">🔦</div>
        <h1 style="color: #e2c044; font-size: 1.6rem; margin-bottom: 25px; font-weight: 300; letter-spacing: 2px;">Вход</h1>

        {% if form.errors %}
            <p style="color: #c04a4a; font-size: 0.9rem; margin-bottom: 15px;">Неверное имя пользователя или пароль.</p>
        {% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <input type="text" name="username" placeholder="Имя пользователя" required
                    style="width: 100%; padding: 12px 20px; background: rgba(22,33,62,0.6); border: 2px solid rgba(226,192,68,0.3); border-radius: 50px; color: #e0d5c1; font-size: 0.95rem; outline: none;">
            </div>
            <div style="margin-bottom: 25px;">
                <input type="password" name="password" placeholder="Пароль" required
                    style="width: 100%; padding: 12px 20px; background: rgba(22,33,62,0.6); border: 2px solid rgba(226,192,68,0.3); border-radius: 50px; color: #e0d5c1; font-size: 0.95rem; outline: none;">
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn-primary-custom" style="width: 100%; border: none; cursor: pointer;">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
