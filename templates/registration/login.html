{% extends 'base.html' %}

{% block title %}Вход — Путь наблюдателя{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 60px auto; padding: 0 20px;">
    <div style="text-align: center; padding: 40px 30px; border: 1px solid rgba(226,192,68,0.2); border-radius: 20px; background: rgba(22,33,62,0.5); backdrop-filter: blur(10px); box-shadow: 0 0 60px rgba(0,0,0,0.3);">
        <div style="font-size: 3rem; margin-bottom: 20px;">🔦</div>
        <h1 style="color: #e2c044; font-size: 1.6rem; margin-bottom: 15px; font-weight: 300; letter-spacing: 2px;">Вход</h1>
        <p style="color: #aab3c9; font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5;">
            На «Пути наблюдателя» нет отдельного пароля — вход только через ВКонтакте.
        </p>
        <a href="{% url 'vk_login_start' %}{% if next %}?next={{ next }}{% endif %}"
           class="btn-lantern" style="display: inline-block; width: 100%; padding: 12px 20px; border-radius: 50px; text-decoration: none; font-size: 0.95rem;">
            Войти через VK
        </a>
    </div>
</div>
{% endblock %}
