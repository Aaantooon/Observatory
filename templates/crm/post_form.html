{% extends 'base.html' %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
    <h1 style="color: #e2c044; font-weight: 300;">Новый пост</h1>
    <form method="post">
        {% csrf_token %}
        <select name="platform" style="width:100%; padding:10px; margin-bottom:10px; background:rgba(22,33,62,0.6); color:#e0d5c1; border:1px solid rgba(226,192,68,0.3); border-radius:8px;">
            <option value="vk">VK</option>
            <option value="telegram">Telegram</option>
            <option value="site">Сайт</option>
        </select>
        <textarea name="text" rows="5" placeholder="Текст поста" style="width:100%; padding:10px; margin-bottom:10px; background:rgba(22,33,62,0.6); color:#e0d5c1; border:1px solid rgba(226,192,68,0.3); border-radius:8px;"></textarea>
        <input type="datetime-local" name="publish_date" style="width:100%; padding:10px; margin-bottom:10px; background:rgba(22,33,62,0.6); color:#e0d5c1; border:1px solid rgba(226,192,68,0.3); border-radius:8px;">
        <button type="submit" class="btn-primary-custom">Сохранить</button>
    </form>
</div>
{% endblock %}
